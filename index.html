<!doctype html>

    <meta charset="UTF-8" />

    <meta name="description" content="A free 3D board game you play in your browser: explore a living island, trade with a crew of computer players and build your way to ten points. On a computer or a phone, with no sign-up." />
    <title>Hexplorers: a 3D island board game in your browser</title>
    <!-- The loading screen's sea, painted before the styles and scripts arrive (no white flash). -->
    <style>html,body{margin:0;height:100%;background:#1d5995 radial-gradient(130% 100% at 50% 42%,#2a6db0 0%,#1d5995 52%,#143f6e 100%) fixed}.chrome-edge{display:none}</style>
    <!-- A phone (by its screen, not the window: an iPad in Split View is narrow too, and an iPad
         reads a fixed edge once and keeps it): the bars' strips are for it alone (base.css). -->
    <script>if (matchMedia('(hover: none)').matches && Math.min(screen.width, screen.height) <= 700) document.documentElement.classList.add('phone');</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://hexplorers.xyz/" />
    <script>
      // Should the game's scripts fail to arrive (a dropped connection) or to start, say so rather
      // than leave the page blank. (Once the loading screen is up, the game reports its own troubles.)
      addEventListener(
        'error',
        function (e) {
          var root = document.getElementById('root');
          var url = e.target instanceof HTMLScriptElement ? e.target.src : e.target === window ? e.filename : '';
          if ((root && root.childElementCount) || !/\/(assets|src)\//.test(url || '')) return;
          var show = function () {
            if (document.getElementById('load-failed')) return;
            var box = document.createElement('div');
            box.id = 'load-failed';
            box.setAttribute('role', 'alert');
            box.style.cssText = 'position: fixed; inset: 0; z-index: 1; display: grid; place-content: center; gap: 16px; padding: 24px; background: #1d5995; color: #f4f9ff; font: 18px/1.5 Georgia, serif; text-align: center';
            box.innerHTML = '<p style="margin: 0">Hexplorers couldn’t load. Check the connection and try again.</p><p style="margin: 0"><button style="font: inherit; padding: 6px 18px; border-radius: 8px; border: 0; color: #1d5995; background: #f4f9ff; cursor: pointer" onclick="location.reload()">Try again</button></p>';
            document.body.appendChild(box);
          };
          if (document.body) show();
          else addEventListener('DOMContentLoaded', show);
        },
        true,
      );
    </script>

         written in by the Worker (src/worker/preview.ts), which also gives this page the clip of
         the island rising for every chat but Discord (Messages plays it in the bubble). -->
